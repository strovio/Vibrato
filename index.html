<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07090e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BelCanto Scope — Анализатор оперного вибрато</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #07090e;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f1f5f9;
      touch-action: manipulation;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body class="relative w-full h-full select-none bg-[#080b10]">

  <!-- Единственный полноэкранный холст -->
  <canvas id="vibratoCanvas" class="w-full h-full cursor-pointer"></canvas>

  <!-- Лаконичная верхняя строка показателей без карточек и лишних подписей -->
  <div id="hudOverlay" class="pointer-events-none fixed inset-x-0 top-0 z-10 px-4 py-3 bg-gradient-to-b from-[#080b10] via-[#080b10]/85 to-transparent">
    <div class="grid grid-cols-4 gap-2 max-w-3xl mx-auto text-center">
      <div>
        <div class="text-[10px] uppercase tracking-wider text-slate-500">Нота</div>
        <div id="hudNoteName" class="text-2xl sm:text-3xl font-bold font-mono-num text-white">—</div>
      </div>
      <div>
        <div class="text-[10px] uppercase tracking-wider text-slate-500">Частота</div>
        <div class="flex items-baseline justify-center gap-1">
          <span id="hudRateValue" class="text-2xl sm:text-3xl font-bold font-mono-num text-slate-300">—</span>
          <span class="text-xs text-slate-500 font-mono-num">Гц</span>
        </div>
      </div>
      <div>
        <div class="text-[10px] uppercase tracking-wider text-slate-500">Широта</div>
        <div class="flex items-baseline justify-center gap-0.5">
          <span id="hudWidthValue" class="text-2xl sm:text-3xl font-bold font-mono-num text-slate-300">—</span>
          <span class="text-xs text-slate-500 font-mono-num">¢</span>
        </div>
      </div>
      <div>
        <div class="text-[10px] uppercase tracking-wider text-slate-500">Ровность</div>
        <div class="flex items-baseline justify-center gap-0.5">
          <span id="hudStabilityValue" class="text-2xl sm:text-3xl font-bold font-mono-num text-slate-300">—</span>
          <span class="text-xs text-slate-500 font-mono-num">%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Минималистичный стартовый экран с одной кнопкой микрофона -->
  <div id="startOverlay" class="fixed inset-0 z-20 flex flex-col items-center justify-center bg-[#080b10] cursor-pointer transition-opacity duration-200">
    <div class="w-20 h-20 rounded-full bg-emerald-500/15 border border-emerald-500/50 flex items-center justify-center text-emerald-400 active:scale-95 transition-transform">
      <svg class="w-9 h-9" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
      </svg>
    </div>
    <span class="mt-4 text-sm font-medium text-slate-300">Нажмите для включения микрофона</span>
    <div id="errorBox" class="hidden mt-4 max-w-xs p-3 rounded-lg bg-rose-950/80 border border-rose-700/60 text-xs text-rose-200 text-center"></div>
  </div>

  <!-- Компактный индикатор паузы -->
  <div id="freezeBadge" class="hidden pointer-events-none fixed bottom-4 left-1/2 -translate-x-1/2 z-10 px-3 py-1 rounded-full bg-slate-800/90 border border-slate-600 text-slate-200 text-xs font-medium">
    Пауза
  </div>

  <script>
    (() => {
      'use strict';

      const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const A4_FREQ = 440.0;
      const A4_MIDI = 69;

      // Оперные ориентиры: 5–7 Гц и ±35..75 центов
      const IDEAL_RATE_MIN = 5.0;
      const IDEAL_RATE_MAX = 7.0;
      const IDEAL_EXTENT_MIN = 35;
      const IDEAL_EXTENT_MAX = 75;
      const STRAIGHT_TONE_MAX = 18;

      const HISTORY_SECONDS = 3.2;

      const canvas = document.getElementById('vibratoCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const startOverlay = document.getElementById('startOverlay');
      const errorBox = document.getElementById('errorBox');
      const freezeBadge = document.getElementById('freezeBadge');

      const hudNoteName = document.getElementById('hudNoteName');
      const hudRateValue = document.getElementById('hudRateValue');
      const hudWidthValue = document.getElementById('hudWidthValue');
      const hudStabilityValue = document.getElementById('hudStabilityValue');

      let audioCtx = null;
      let analyser = null;
      let timeBuffer = null;
      let isRunning = false;
      let isFrozen = false;
      let freezeTime = 0;

      const pitchHistory = [];
      const extremaHistory = [];

      let currentCenterMidi = 69.0;
      let displayCenterMidi = 69.0;
      let lastValidPitchTime = 0;
      let smoothedMidiState = null;
      let prevFrameTime = performance.now() / 1000;

      const metrics = {
        active: false,
        noteName: '—',
        rateHz: 0,
        extentCents: 0,
        stabilityPct: 0,
        cyclesCount: 0,
        stateCode: 'idle'
      };

      let extremumCandidate = null;
      let lastExtremumType = null;

      let viewWidth = window.innerWidth;
      let viewHeight = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2.5);

      function resizeCanvas() {
        viewWidth = window.innerWidth;
        viewHeight = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.width = Math.floor(viewWidth * dpr);
        canvas.height = Math.floor(viewHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas, { passive: true });
      resizeCanvas();

      // Удержание экрана включенным на пюпитре (Screen Wake Lock API)
      async function requestScreenWakeLock() {
        try {
          if ('wakeLock' in navigator) {
            await navigator.wakeLock.request('screen');
          }
        } catch (_) {
          // Игнорируем, если браузер не разрешил Wake Lock
        }
      }

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && isRunning) {
          requestScreenWakeLock();
        }
      });

      /**
       * Высокоточный алгоритм определения основного тона (f0) на базе
       * Normalized Square Difference Function (McLeod Pitch Method / MPM).
       * Устойчив к мощным оперным формантам (2.8–3.2 кГц) и не прыгает на октаву вверх.
       */
      function detectPitchMPM(buffer, sampleRate) {
        const N = buffer.length;

        // 1. Вычисляем уровень сигнала (RMS) и среднее значение (DC-offset)
        let sumSq = 0;
        let mean = 0;
        for (let i = 0; i < N; i++) {
          mean += buffer[i];
        }
        mean /= N;

        for (let i = 0; i < N; i++) {
          const v = buffer[i] - mean;
          sumSq += v * v;
        }
        const rms = Math.sqrt(sumSq / N);

        // Порог тишины (отсекает фоновый шум комнаты)
        if (rms < 0.008) {
          return null;
        }

        // Диапазон певческого голоса: от Баса (E2 ~ 75 Гц) до Колоратурного сопрано (F6 ~ 1400 Гц)
        const minFreq = 72;
        const maxFreq = 1450;
        const minLag = Math.max(2, Math.floor(sampleRate / maxFreq));
        const maxLag = Math.min(Math.floor(N * 0.65), Math.ceil(sampleRate / minFreq));

        // Используем окно анализа M = min(N, 1536) для быстродействия на 60 FPS
        const M = Math.min(N, 1536);
        const limitLag = Math.min(maxLag, M - 4);

        const nsdf = new Float32Array(limitLag + 1);

        // Вычисляем NSDF(tau) = 2 * r(tau) / m(tau)
        for (let tau = minLag; tau <= limitLag; tau++) {
          let acf = 0;
          let norm = 0;
          const count = M - tau;
          for (let i = 0; i < count; i++) {
            const x0 = buffer[i] - mean;
            const x1 = buffer[i + tau] - mean;
            acf += x0 * x1;
            norm += x0 * x0 + x1 * x1;
          }
          nsdf[tau] = norm > 1e-9 ? (2 * acf) / norm : 0;
        }

        // Ищем положительные области (между пересечениями нуля) и локальные максимумы в них
        const peaks = [];
        let inPositiveRegion = false;
        let currentMaxVal = -1;
        let currentMaxTau = -1;

        for (let tau = minLag; tau <= limitLag; tau++) {
          const val = nsdf[tau];
          if (val > 0) {
            if (!inPositiveRegion) {
              inPositiveRegion = true;
              currentMaxVal = val;
              currentMaxTau = tau;
            } else if (val > currentMaxVal) {
              currentMaxVal = val;
              currentMaxTau = tau;
            }
          } else if (inPositiveRegion) {
            if (currentMaxVal > 0.45) {
              peaks.push({ tau: currentMaxTau, val: currentMaxVal });
            }
            inPositiveRegion = false;
          }
        }
        if (inPositiveRegion && currentMaxVal > 0.45) {
          peaks.push({ tau: currentMaxTau, val: currentMaxVal });
        }

        if (peaks.length === 0) return null;

        // Глобальный максимум среди всех пиков
        let highestPeakVal = 0;
        for (let i = 0; i < peaks.length; i++) {
          if (peaks[i].val > highestPeakVal) {
            highestPeakVal = peaks[i].val;
          }
        }

        // Порог чистоты тона (clarity)
        if (highestPeakVal < 0.58) return null;

        // Ключевой шаг MPM: выбираем ПЕРВЫЙ пик, превышающий k * highestPeakVal (k = 0.86)
        // Это предотвращает деление частоты пополам (субгармоники)
        const threshold = highestPeakVal * 0.86;
        let chosenPeak = peaks[0];
        for (let i = 0; i < peaks.length; i++) {
          if (peaks[i].val >= threshold) {
            chosenPeak = peaks[i];
            break;
          }
        }

        const tau = chosenPeak.tau;
        let refinedTau = tau;

        // Параболическая интерполяция для суб-семпловой точности (точность < 0.3 цента)
        if (tau > minLag && tau < limitLag) {
          const y1 = nsdf[tau - 1];
          const y2 = nsdf[tau];
          const y3 = nsdf[tau + 1];
          const denom = y1 - 2 * y2 + y3;
          if (Math.abs(denom) > 1e-7) {
            const delta = (0.5 * (y1 - y3)) / denom;
            if (Math.abs(delta) < 1) {
              refinedTau = tau + delta;
            }
          }
        }

        const freq = sampleRate / refinedTau;
        if (freq < minFreq || freq > maxFreq) return null;

        return {
          freq,
          clarity: chosenPeak.val,
          rms
        };
      }

      /**
       * Перевод частоты (Гц) в непрерывное значение MIDI (полутоны, где 69.00 = A4 440 Гц)
       */
      function freqToMidi(freq) {
        return A4_MIDI + 12 * Math.log2(freq / A4_FREQ);
      }

      function midiToFreq(midi) {
        return A4_FREQ * Math.pow(2, (midi - A4_MIDI) / 12);
      }

      function formatNoteInfo(midi) {
        const nearestMidi = Math.round(midi);
        const cents = Math.round((midi - nearestMidi) * 100);
        const noteIndex = ((nearestMidi % 12) + 12) % 12;
        const octave = Math.floor(nearestMidi / 12) - 1;
        return {
          nearestMidi,
          name: `${NOTE_NAMES[noteIndex]}${octave}`,
          cents
        };
      }

      function processPitchSample(nowSec, detection) {
        const dt = Math.min(0.1, Math.max(0.004, nowSec - prevFrameTime));
        prevFrameTime = nowSec;

        const cutoffTime = nowSec - (HISTORY_SECONDS + 0.5);
        while (pitchHistory.length > 0 && pitchHistory[0].t < cutoffTime) {
          pitchHistory.shift();
        }
        while (extremaHistory.length > 0 && extremaHistory[0].t < cutoffTime) {
          extremaHistory.shift();
        }

        if (!detection) {
          if (nowSec - lastValidPitchTime > 0.16) {
            smoothedMidiState = null;
            extremumCandidate = null;
            lastExtremumType = null;
            metrics.active = false;
          }
          updateCamera(dt, null);
          return;
        }

        const rawMidi = freqToMidi(detection.freq);

        // При смене ноты или после паузы мгновенно захватываем новую высоту
        if (smoothedMidiState === null || Math.abs(rawMidi - smoothedMidiState) > 1.2) {
          smoothedMidiState = rawMidi;
          currentCenterMidi = rawMidi;
          extremumCandidate = null;
          lastExtremumType = null;
          extremaHistory.length = 0;
        } else {
          const alpha = 1 - Math.exp(-dt * 75);
          smoothedMidiState += alpha * (rawMidi - smoothedMidiState);
        }

        lastValidPitchTime = nowSec;
        const smoothMidi = smoothedMidiState;

        // Быстрое вычисление центра ноты за последние 0.30 с
        const windowStart = nowSec - 0.30;
        let sumMidi = smoothMidi;
        let minWin = smoothMidi;
        let maxWin = smoothMidi;
        let countWin = 1;

        for (let i = pitchHistory.length - 1; i >= 0; i--) {
          const pt = pitchHistory[i];
          if (pt.t < windowStart) break;
          if (Math.abs(pt.smoothMidi - smoothMidi) < 1.2) {
            sumMidi += pt.smoothMidi;
            if (pt.smoothMidi < minWin) minWin = pt.smoothMidi;
            if (pt.smoothMidi > maxWin) maxWin = pt.smoothMidi;
            countWin++;
          } else {
            break;
          }
        }

        const targetCenterMidi = countWin > 4
          ? 0.5 * (minWin + maxWin) * 0.6 + (sumMidi / countWin) * 0.4
          : sumMidi / countWin;

        // Быстрая подстройка центра (чтобы ось не отставала от голоса)
        const centerAlpha = 1 - Math.exp(-dt * 22);
        currentCenterMidi += centerAlpha * (targetCenterMidi - currentCenterMidi);

        const offsetCents = (smoothMidi - currentCenterMidi) * 100;

        detectVibratoExtrema(nowSec, smoothMidi, currentCenterMidi, offsetCents);
        computeVibratoStatistics(nowSec, currentCenterMidi, offsetCents);

        pitchHistory.push({
          t: nowSec,
          smoothMidi,
          centerMidi: currentCenterMidi,
          offsetCents,
          stateCode: metrics.stateCode
        });

        updateCamera(dt, smoothMidi);
      }

      function detectVibratoExtrema(t, midi, centerMidi, offsetCents) {
        const HYSTERESIS_CENTS = 13;
        const MIN_EXCURSION = 10;

        if (!extremumCandidate) {
          extremumCandidate = {
            maxOffset: offsetCents, maxT: t, maxMidi: midi,
            minOffset: offsetCents, minT: t, minMidi: midi
          };
          return;
        }

        if (offsetCents > extremumCandidate.maxOffset) {
          extremumCandidate.maxOffset = offsetCents;
          extremumCandidate.maxT = t;
          extremumCandidate.maxMidi = midi;
        }
        if (offsetCents < extremumCandidate.minOffset) {
          extremumCandidate.minOffset = offsetCents;
          extremumCandidate.minT = t;
          extremumCandidate.minMidi = midi;
        }

        if (
          lastExtremumType !== 'peak' &&
          extremumCandidate.maxOffset >= MIN_EXCURSION &&
          extremumCandidate.maxOffset - offsetCents >= HYSTERESIS_CENTS
        ) {
          registerExtremum({
            t: extremumCandidate.maxT,
            midi: extremumCandidate.maxMidi,
            type: 'peak'
          });
          lastExtremumType = 'peak';
          extremumCandidate.minOffset = offsetCents;
          extremumCandidate.minT = t;
          extremumCandidate.minMidi = midi;
        } else if (
          lastExtremumType !== 'trough' &&
          extremumCandidate.minOffset <= -MIN_EXCURSION &&
          offsetCents - extremumCandidate.minOffset >= HYSTERESIS_CENTS
        ) {
          registerExtremum({
            t: extremumCandidate.minT,
            midi: extremumCandidate.minMidi,
            type: 'trough'
          });
          lastExtremumType = 'trough';
          extremumCandidate.maxOffset = offsetCents;
          extremumCandidate.maxT = t;
          extremumCandidate.maxMidi = midi;
        }
      }

      function registerExtremum(ext) {
        let periodHz = 0;
        let swingCents = 0;

        for (let i = extremaHistory.length - 1; i >= 0; i--) {
          const prev = extremaHistory[i];
          if (prev.type === ext.type) {
            const dtPeriod = ext.t - prev.t;
            if (dtPeriod >= 0.095 && dtPeriod <= 0.36) {
              periodHz = 1.0 / dtPeriod;
            }
            break;
          }
        }

        if (extremaHistory.length > 0) {
          const prevOpp = extremaHistory[extremaHistory.length - 1];
          if (prevOpp.type !== ext.type && (ext.t - prevOpp.t) <= 0.25) {
            swingCents = Math.abs(ext.midi - prevOpp.midi) * 50;
          }
        }

        ext.periodHz = periodHz;
        ext.swingCents = swingCents;
        extremaHistory.push(ext);
      }

      function computeVibratoStatistics(nowSec, centerMidi, offsetCents) {
        metrics.active = true;
        metrics.noteName = formatNoteInfo(centerMidi).name;

        const recentExtrema = extremaHistory.filter(e => e.t >= nowSec - 1.5);
        const validPeriods = [];
        const validSwings = [];

        for (let i = 0; i < recentExtrema.length; i++) {
          const e = recentExtrema[i];
          if (e.periodHz >= 2.8 && e.periodHz <= 10.5) validPeriods.push(e.periodHz);
          if (e.swingCents >= 10 && e.swingCents <= 180) validSwings.push(e.swingCents);
        }

        const lastExtTime = recentExtrema.length > 0 ? recentExtrema[recentExtrema.length - 1].t : 0;
        const timeSinceLastExtremum = nowSec - lastExtTime;

        if (validPeriods.length >= 2 && timeSinceLastExtremum < 0.45) {
          const meanRate = validPeriods.reduce((a, b) => a + b, 0) / validPeriods.length;
          metrics.rateHz = metrics.rateHz > 0 ? metrics.rateHz * 0.3 + meanRate * 0.7 : meanRate;

          const meanSwing = validSwings.length > 0
            ? validSwings.reduce((a, b) => a + b, 0) / validSwings.length
            : Math.abs(offsetCents);
          metrics.extentCents = metrics.extentCents > 0 ? metrics.extentCents * 0.3 + meanSwing * 0.7 : meanSwing;

          const rateCV = computeCoefficientOfVariation(validPeriods);
          const swingCV = validSwings.length >= 2 ? computeCoefficientOfVariation(validSwings) : 0.08;
          const rateStability = Math.max(0, Math.min(100, 100 * (1 - rateCV * 3.2)));
          const ampStability = Math.max(0, Math.min(100, 100 * (1 - swingCV * 2.1)));
          const rawStability = 0.6 * rateStability + 0.4 * ampStability;

          metrics.stabilityPct = Math.round(
            metrics.stabilityPct > 0 ? metrics.stabilityPct * 0.35 + rawStability * 0.65 : rawStability
          );
          metrics.cyclesCount = Math.floor(recentExtrema.length / 2);

          if (metrics.extentCents < STRAIGHT_TONE_MAX) {
            metrics.stateCode = 'straight';
          } else if (metrics.rateHz < IDEAL_RATE_MIN || metrics.rateHz > IDEAL_RATE_MAX || metrics.extentCents > IDEAL_EXTENT_MAX + 15) {
            metrics.stateCode = 'warn';
          } else {
            metrics.stateCode = 'optimal';
          }
        } else {
          let recentMaxDev = 0;
          for (let i = pitchHistory.length - 1; i >= 0; i--) {
            if (nowSec - pitchHistory[i].t > 0.3) break;
            recentMaxDev = Math.max(recentMaxDev, Math.abs(pitchHistory[i].offsetCents));
          }
          metrics.extentCents = metrics.extentCents * 0.75 + recentMaxDev * 0.25;
          if (timeSinceLastExtremum >= 0.45) {
            metrics.rateHz = 0;
            metrics.stabilityPct = 0;
            metrics.cyclesCount = 0;
            metrics.stateCode = 'straight';
          }
        }
      }

      function computeCoefficientOfVariation(arr) {
        if (arr.length < 2) return 0;
        const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
        if (Math.abs(mean) < 1e-6) return 0;
        let sqDiff = 0;
        for (let i = 0; i < arr.length; i++) {
          const d = arr[i] - mean;
          sqDiff += d * d;
        }
        return Math.sqrt(sqDiff / arr.length) / mean;
      }

      /**
       * Мгновенное удержание голоса в видимой области экрана:
       * при больших скачках камера сразу переходит за голосом, не давая линии уйти за край.
       */
      function updateCamera(dt, liveMidi) {
        const fastAlpha = 1 - Math.exp(-dt * 26);
        displayCenterMidi += fastAlpha * (currentCenterMidi - displayCenterMidi);

        // Жесткое ограничение: голос никогда не может отклониться от центра экрана больше чем на 1.2 полутона
        if (liveMidi !== null) {
          const maxOffsetSemitones = 1.2;
          if (liveMidi - displayCenterMidi > maxOffsetSemitones) {
            displayCenterMidi = liveMidi - maxOffsetSemitones;
          } else if (displayCenterMidi - liveMidi > maxOffsetSemitones) {
            displayCenterMidi = liveMidi + maxOffsetSemitones;
          }
        }
      }

      let lastHudUpdate = 0;
      function updateHudDOM(nowMs) {
        if (nowMs - lastHudUpdate < 50) return;
        lastHudUpdate = nowMs;

        if (!metrics.active && !isFrozen) return;

        hudNoteName.textContent = metrics.noteName;

        if (metrics.rateHz > 0) {
          hudRateValue.textContent = metrics.rateHz.toFixed(1);
          const rateOk = metrics.rateHz >= IDEAL_RATE_MIN && metrics.rateHz <= IDEAL_RATE_MAX;
          hudRateValue.className = `text-2xl sm:text-3xl font-bold font-mono-num ${rateOk ? 'text-emerald-400' : 'text-amber-400'}`;
        } else {
          hudRateValue.textContent = '—';
          hudRateValue.className = 'text-2xl sm:text-3xl font-bold font-mono-num text-slate-400';
        }

        const ext = Math.round(metrics.extentCents);
        hudWidthValue.textContent = `±${ext}`;
        const widthOk = ext >= IDEAL_EXTENT_MIN && ext <= IDEAL_EXTENT_MAX;
        hudWidthValue.className = `text-2xl sm:text-3xl font-bold font-mono-num ${widthOk ? 'text-emerald-400' : 'text-sky-300'}`;

        if (metrics.rateHz > 0 && metrics.cyclesCount >= 1) {
          hudStabilityValue.textContent = `${metrics.stabilityPct}`;
          const stabOk = metrics.stabilityPct >= 80;
          hudStabilityValue.className = `text-2xl sm:text-3xl font-bold font-mono-num ${stabOk ? 'text-emerald-400' : 'text-amber-400'}`;
        } else {
          hudStabilityValue.textContent = '—';
          hudStabilityValue.className = 'text-2xl sm:text-3xl font-bold font-mono-num text-slate-400';
        }
      }

      function getStateColor(stateCode) {
        if (stateCode === 'optimal') return '#10b981'; // Зеленый (норма)
        if (stateCode === 'warn') return '#f59e0b';    // Желтый (отклонение)
        return '#38bdf8';                              // Голубой (прямой тон)
      }

      function renderUnifiedGraph(renderTimeSec) {
        const w = viewWidth;
        const h = viewHeight;

        ctx.fillStyle = '#080b10';
        ctx.fillRect(0, 0, w, h);

        const plotTop = 68;
        const plotBottom = h - 16;
        const plotHeight = Math.max(120, plotBottom - plotTop);

        const leftMargin = 48;
        const nowX = w - 24;
        const traceWidth = Math.max(100, nowX - leftMargin);

        // Отображаем 4.6 полутона по вертикали — голос всегда свободно помещается на экране
        const visibleSemitones = 4.6;
        const pxPerSemitone = plotHeight / visibleSemitones;
        const pxPerCent = pxPerSemitone / 100;
        const plotCenterY = plotTop + plotHeight * 0.5;

        const midiToY = (midi) => plotCenterY - (midi - displayCenterMidi) * pxPerSemitone;
        const timeToX = (t) => nowX - ((renderTimeSec - t) / HISTORY_SECONDS) * traceWidth;

        // 1. Зеленый коридор эталонной широты вибрато (±50 центов вокруг текущей ноты)
        const activeCenterMidi = metrics.active || isFrozen ? currentCenterMidi : Math.round(displayCenterMidi);
        const centerLineY = midiToY(activeCenterMidi);
        const corridorHalfPx = 50 * pxPerCent;

        ctx.fillStyle = 'rgba(16, 185, 129, 0.08)';
        ctx.fillRect(leftMargin, centerLineY - corridorHalfPx, traceWidth, corridorHalfPx * 2);

        // Пунктирные границы ±50 центов
        ctx.save();
        ctx.setLineDash([4, 6]);
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.35)';
        ctx.lineWidth = 1;
        [-50, 50].forEach(c => {
          const y = centerLineY - c * pxPerCent;
          ctx.beginPath();
          ctx.moveTo(leftMargin, y);
          ctx.lineTo(nowX, y);
          ctx.stroke();
        });
        ctx.restore();

        // Ось центра тона
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(leftMargin, centerLineY);
        ctx.lineTo(nowX, centerLineY);
        ctx.stroke();

        // 2. Горизонтальная сетка нот (полутонов)
        const minVisibleMidi = Math.floor(displayCenterMidi - visibleSemitones * 0.55);
        const maxVisibleMidi = Math.ceil(displayCenterMidi + visibleSemitones * 0.55);
        const nearestActiveMidi = Math.round(activeCenterMidi);

        for (let m = minVisibleMidi; m <= maxVisibleMidi; m++) {
          const y = midiToY(m);
          if (y < plotTop || y > plotBottom) continue;

          const isTarget = m === nearestActiveMidi;
          const noteInfo = formatNoteInfo(m);

          ctx.strokeStyle = isTarget ? 'rgba(148, 163, 184, 0.28)' : 'rgba(30, 41, 59, 0.7)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(leftMargin, y);
          ctx.lineTo(nowX, y);
          ctx.stroke();

          ctx.fillStyle = isTarget ? '#f8fafc' : '#64748b';
          ctx.font = isTarget ? '700 12px "JetBrains Mono", monospace' : '500 11px "JetBrains Mono", monospace';
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          ctx.fillText(noteInfo.name, leftMargin - 8, y);
        }

        // 3. Кривая голоса
        const segments = [];
        let currentSeg = [];
        for (let i = 0; i < pitchHistory.length; i++) {
          const pt = pitchHistory[i];
          if (pt.t < renderTimeSec - HISTORY_SECONDS) continue;
          if (pt.t > renderTimeSec) break;

          if (currentSeg.length > 0) {
            const prev = currentSeg[currentSeg.length - 1];
            if (pt.t - prev.t > 0.16 || Math.abs(pt.smoothMidi - prev.smoothMidi) > 1.5) {
              segments.push(currentSeg);
              currentSeg = [];
            }
          }
          currentSeg.push(pt);
        }
        if (currentSeg.length > 0) segments.push(currentSeg);

        ctx.save();
        ctx.beginPath();
        ctx.rect(leftMargin, plotTop, traceWidth, plotHeight);
        ctx.clip();

        segments.forEach(seg => {
          if (seg.length < 2) return;
          const lastState = seg[seg.length - 1].stateCode;
          ctx.strokeStyle = getStateColor(lastState);
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          drawSmoothCurve(ctx, seg, timeToX, midiToY);
          ctx.stroke();
        });

        // Точки на пиках и впадинах для наглядного контроля ровности волны
        for (let i = 0; i < extremaHistory.length; i++) {
          const ext = extremaHistory[i];
          if (ext.t < renderTimeSec - HISTORY_SECONDS || ext.t > renderTimeSec) continue;
          const x = timeToX(ext.t);
          const y = midiToY(ext.midi);
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();

        // Живая точка текущего звука справа
        const latestPt = pitchHistory.length > 0 ? pitchHistory[pitchHistory.length - 1] : null;
        if (latestPt && (renderTimeSec - latestPt.t < 0.18 || isFrozen)) {
          const liveY = midiToY(latestPt.smoothMidi);
          ctx.fillStyle = getStateColor(latestPt.stateCode);
          ctx.beginPath();
          ctx.arc(nowX, liveY, 5.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawSmoothCurve(context, pts, xFn, yFn) {
        context.beginPath();
        const x0 = xFn(pts[0].t);
        const y0 = yFn(pts[0].smoothMidi);
        context.moveTo(x0, y0);

        for (let i = 1; i < pts.length - 1; i++) {
          const xc = 0.5 * (xFn(pts[i].t) + xFn(pts[i + 1].t));
          const yc = 0.5 * (yFn(pts[i].smoothMidi) + yFn(pts[i + 1].smoothMidi));
          context.quadraticCurveTo(xFn(pts[i].t), yFn(pts[i].smoothMidi), xc, yc);
        }

        const last = pts[pts.length - 1];
        context.lineTo(xFn(last.t), yFn(last.smoothMidi));
      }

      async function initAudio() {
        try {
          errorBox.classList.add('hidden');
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();

          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }

          // КРИТИЧНО для оперного вокала на телефонах:
          // отключаем noiseSuppression и autoGainControl, чтобы браузер не подавлял длинные гласные ноты
          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false,
                channelCount: 1
              }
            });
          } catch (_) {
            // Запасной вариант, если браузер не принимает расширенные ограничения
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }

          const source = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0.0;
          source.connect(analyser);

          timeBuffer = new Float32Array(analyser.fftSize);
          isRunning = true;

          // Скрываем стартовый экран
          startOverlay.classList.add('opacity-0', 'pointer-events-none');
          setTimeout(() => {
            startOverlay.classList.add('hidden');
          }, 300);

          requestScreenWakeLock();
        } catch (err) {
          errorBox.textContent = `Не удалось получить доступ к микрофону: ${err.message || 'разрешите доступ к микрофону в браузере и откройте страницу по HTTPS или localhost.'}`;
          errorBox.classList.remove('hidden');
        }
      }

      // Запуск микрофона по первому касанию стартового оверлея
      startOverlay.addEventListener('click', () => {
        if (!isRunning) {
          initAudio();
        }
      });

      // Касание самого графика переключает СТОП-КАДР (Freeze) для удобного разбора спетой ноты
      canvas.addEventListener('click', () => {
        if (!isRunning) {
          initAudio();
          return;
        }
        isFrozen = !isFrozen;
        if (isFrozen) {
          freezeTime = performance.now() / 1000;
          freezeBadge.classList.remove('hidden');
        } else {
          prevFrameTime = performance.now() / 1000;
          freezeBadge.classList.add('hidden');
        }
      });

      // Главный цикл 60–120 FPS
      function animate(nowMs) {
        requestAnimationFrame(animate);

        const nowSec = nowMs / 1000;

        if (isRunning && !isFrozen && analyser && timeBuffer) {
          analyser.getFloatTimeDomainData(timeBuffer);
          const detection = detectPitchMPM(timeBuffer, audioCtx.sampleRate);
          processPitchSample(nowSec, detection);
          updateHudDOM(nowMs);
        }

        const renderTime = isFrozen ? freezeTime : nowSec;
        renderUnifiedGraph(renderTime);
      }

      window.onload = () => {
        requestAnimationFrame(animate);
      };
    })();
  </script>
</body>
</html>
