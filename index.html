<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Vibrato — Оперный анализатор</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06070a;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    .mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    /* Плавное исчезновение стартового экрана */
    #startOverlay {
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
    }
    #startOverlay.hidden-overlay {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-[#06070a]">

  <!-- Единственный полноэкранный график -->
  <canvas id="pitchCanvas"></canvas>

  <!-- Минималистичная верхняя панель метрик (прозрачный HUD поверх графика) -->
  <div id="hud" class="pointer-events-none fixed top-0 left-0 right-0 z-10 flex items-start justify-between px-4 pt-3 pb-2 sm:px-6 sm:pt-4 opacity-0 transition-opacity duration-500">
    <!-- Текущая нота и отклонение центра вибрато -->
    <div class="flex items-baseline gap-3">
      <div id="noteDisplay" class="mono-num text-4xl sm:text-5xl font-semibold tracking-tight text-slate-100 leading-none">
        —
      </div>
      <div class="flex flex-col">
        <span id="freqDisplay" class="mono-num text-xs sm:text-sm text-slate-400 leading-tight">— Гц</span>
        <span id="centsDisplay" class="mono-num text-[11px] sm:text-xs text-slate-500 leading-tight">центр 0 ц</span>
      </div>
    </div>

    <!-- Метрики вибрато: Периодичность (Гц) и Широта (полутоны) -->
    <div class="flex items-center gap-5 sm:gap-7 bg-[#0b0d13]/80 backdrop-blur-md border border-slate-800/60 rounded-xl px-3.5 py-2">
      <div class="flex flex-col items-end">
        <span class="text-[10px] uppercase tracking-wider text-slate-500 font-medium">Частота</span>
        <span id="rateDisplay" class="mono-num text-base sm:text-lg font-medium text-cyan-400 leading-tight">— Гц</span>
      </div>
      <div class="h-6 w-[1px] bg-slate-800/80"></div>
      <div class="flex flex-col items-end">
        <span class="text-[10px] uppercase tracking-wider text-slate-500 font-medium">Широта</span>
        <span id="extentDisplay" class="mono-num text-base sm:text-lg font-medium text-indigo-400 leading-tight">±— пт</span>
      </div>
    </div>
  </div>

  <!-- Минималистичный индикатор паузы при касании графика -->
  <div id="pauseBadge" class="pointer-events-none fixed bottom-4 left-1/2 -translate-x-1/2 z-10 hidden items-center gap-2 rounded-full bg-slate-900/90 border border-slate-700/60 px-3.5 py-1 text-xs text-slate-300 tracking-wide backdrop-blur-md">
    <span class="h-1.5 w-1.5 rounded-full bg-amber-400"></span>
    <span>ПАУЗА</span>
  </div>

  <!-- Экран первого касания (необходим для активации микрофона в мобильных браузерах) -->
  <div id="startOverlay" class="fixed inset-0 z-20 flex flex-col items-center justify-center bg-[#06070a]/95 backdrop-blur-sm px-6 text-center cursor-pointer">
    <div class="group relative flex h-20 w-20 items-center justify-center rounded-full border border-slate-800 bg-slate-900/60 transition-transform duration-300 active:scale-95">
      <div class="absolute inset-0 rounded-full bg-cyan-500/10 blur-xl group-hover:bg-cyan-500/20 transition-all"></div>
      <svg class="h-8 w-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
      </svg>
    </div>
    <p id="startPromptText" class="mt-5 text-sm font-normal tracking-wide text-slate-400">
      Коснитесь экрана для запуска микрофона
    </p>
  </div>

  <script>
    (() => {
      'use strict';

      // Ноты в стандартной полутоновой шкале
      const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const A4_FREQ = 440.0;
      const A4_MIDI = 69;

      // Вокальный диапазон фундаментальной частоты f0 (от баса профундо ~75 Гц до сопрано C6/F6 ~1450 Гц)
      const MIN_VOCAL_FREQ = 75.0;
      const MAX_VOCAL_FREQ = 1450.0;

      // Параметры фильтрации шума, дыхания и шипящих согласных (с, ш, щ, ц, ч, ф)
      const RMS_ONSET_THRESHOLD = 0.0085;     // Порог включения голоса
      const RMS_HOLD_THRESHOLD = 0.0055;      // Гистерезис удержанияпевческого тона
      const MAX_ZCR_VOICED = 0.22;            // Отсечение высокочастотных шипящих по пересечению нуля
      const HF_LF_RATIO_MAX = 1.65;           // Отношение ВЧ-энергии к НЧ (шипящие дают высокий ВЧ-всплеск)
      const NSDF_CLARITY_THRESHOLD = 0.78;    // Порог гармонической периодичности (McLeod NSDF)
      const MAX_SEMITONE_JUMP_PER_FRAME = 2.8;// Защита от мгновенных октавных скачков на атаке

      // Параметры временного окна графика
      const HISTORY_SECONDS = 4.2;            // Длительность видимой истории на экране (сек)
      const SAMPLE_FPS = 60;                  // Частота записи точек траектории
      const BUFFER_CAPACITY = Math.ceil(HISTORY_SECONDS * SAMPLE_FPS) + 60;
      const VISIBLE_SEMITONE_SPAN = 6.5;      // Диапазон по вертикали (полутонов), чтобы вибрато было крупным

      const canvas = document.getElementById('pitchCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const startOverlay = document.getElementById('startOverlay');
      const startPromptText = document.getElementById('startPromptText');
      const hud = document.getElementById('hud');
      const pauseBadge = document.getElementById('pauseBadge');

      const noteDisplay = document.getElementById('noteDisplay');
      const freqDisplay = document.getElementById('freqDisplay');
      const centsDisplay = document.getElementById('centsDisplay');
      const rateDisplay = document.getElementById('rateDisplay');
      const extentDisplay = document.getElementById('extentDisplay');

      let audioCtx = null;
      let rawAnalyser = null;
      let vocalBandAnalyser = null;
      let rawTimeBuffer = null;
      let bandTimeBuffer = null;
      let nsdfBuffer = null;

      let isRunning = false;
      let isPaused = false;

      // Состояние детектора голоса и анти-спайк медианного фильтра
      let isVoicedState = false;
      let unvoicedFramesCount = 0;
      const recentMidiWindow = []; // Буфер из 3 последних значений для медианной фильтрации
      let lastAcceptedMidi = null;
      let smoothedInstantMidi = null;

      // Плавная камера по вертикали (центрируется по ядру голоса, не качаясь от самого вибрато)
      let cameraCenterMidi = 64.0; // E4 по умолчанию
      let targetCameraMidi = 64.0;

      // Кольцевой буфер истории для отрисовки графика без аллокаций памяти (Zero-GC)
      const historyTime = new Float64Array(BUFFER_CAPACITY);
      const historyMidi = new Float32Array(BUFFER_CAPACITY);
      const historyCenter = new Float32Array(BUFFER_CAPACITY);
      const historyEnvUpper = new Float32Array(BUFFER_CAPACITY);
      const historyEnvLower = new Float32Array(BUFFER_CAPACITY);
      const historyVoiced = new Uint8Array(BUFFER_CAPACITY);
      let historyHead = 0;
      let historyCount = 0;

      // Вспомогательные функции перевода частот и нот
      function freqToMidi(freq) {
        return A4_MIDI + 12.0 * Math.log2(freq / A4_FREQ);
      }

      function midiToFreq(midi) {
        return A4_FREQ * Math.pow(2.0, (midi - A4_MIDI) / 12.0);
      }

      function midiToNoteLabel(midiInt) {
        const noteIndex = ((midiInt % 12) + 12) % 12;
        const octave = Math.floor(midiInt / 12) - 1;
        return NOTE_NAMES[noteIndex] + octave;
      }

      function isBlackKey(midiInt) {
        const n = ((midiInt % 12) + 12) % 12;
        return n === 1 || n === 3 || n === 6 || n === 8 || n === 10;
      }

      function medianOf3(a, b, c) {
        return Math.max(Math.min(a, b), Math.min(Math.max(a, b), c));
      }

      let viewWidth = window.innerWidth;
      let viewHeight = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 3);

      function resizeCanvas() {
        viewWidth = window.innerWidth;
        viewHeight = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 3);
        canvas.width = Math.floor(viewWidth * dpr);
        canvas.height = Math.floor(viewHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas, { passive: true });
      resizeCanvas();

      async function initAudio() {
        if (isRunning) return;

        try {
          startPromptText.textContent = 'Подключение к микрофону...';

          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();

          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }

          // Запрашиваем чистый вокальный поток без агрессивного браузерного шумоподавления,
          // которое искажает долгие оперные ноты и съедает обертоны
          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false,
                channelCount: 1
              }
            });
          } catch (fallbackErr) {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }

          const source = audioCtx.createMediaStreamSource(stream);

          // 1. Сырой анализатор для оценки спектрального баланса и детекции шипящих согласных (ZCR)
          rawAnalyser = audioCtx.createAnalyser();
          rawAnalyser.fftSize = 2048;
          rawAnalyser.smoothingTimeConstant = 0.0;
          source.connect(rawAnalyser);

          // 2. Полосовой тракт выделения фундаментального тона f0:
          //    - Фильтр верхних частот (70 Гц) убирает гул помещения и задувание микрофона
          //    - Каскад из двух фильтров нижних частот (1500 Гц) полностью отсекает
          //      высокочастотную энергию шипящих («с», «ш», «щ», «ц», «ф») и певческую форманту (2800 Гц),
          //      предотвращая ложные срабатывания и скачки на октаву/квинту вверх.
          const hpFilter = audioCtx.createBiquadFilter();
          hpFilter.type = 'highpass';
          hpFilter.frequency.value = 70.0;
          hpFilter.Q.value = 0.707;

          const lpFilter1 = audioCtx.createBiquadFilter();
          lpFilter1.type = 'lowpass';
          lpFilter1.frequency.value = 1500.0;
          lpFilter1.Q.value = 0.707;

          const lpFilter2 = audioCtx.createBiquadFilter();
          lpFilter2.type = 'lowpass';
          lpFilter2.frequency.value = 1500.0;
          lpFilter2.Q.value = 0.707;

          vocalBandAnalyser = audioCtx.createAnalyser();
          vocalBandAnalyser.fftSize = 2048;
          vocalBandAnalyser.smoothingTimeConstant = 0.0;

          source.connect(hpFilter);
          hpFilter.connect(lpFilter1);
          lpFilter1.connect(lpFilter2);
          lpFilter2.connect(vocalBandAnalyser);

          const bufferLen = vocalBandAnalyser.fftSize;
          rawTimeBuffer = new Float32Array(bufferLen);
          bandTimeBuffer = new Float32Array(bufferLen);
          nsdfBuffer = new Float32Array(bufferLen);

          isRunning = true;
          startOverlay.classList.add('hidden-overlay');
          hud.classList.remove('opacity-0');

          requestAnimationFrame(mainLoop);
        } catch (err) {
          startPromptText.textContent = 'Нет доступа к микрофону. Разрешите доступ и коснитесь снова.';
          startPromptText.classList.add('text-rose-400');
        }
      }

      startOverlay.addEventListener('click', initAudio);
      startOverlay.addEventListener('touchend', (e) => {
        e.preventDefault();
        initAudio();
      });

      // Касание самого графика ставит его на паузу / снимает с паузы для удобного разбора спетой фразы
      canvas.addEventListener('pointerdown', () => {
        if (!isRunning) return;
        isPaused = !isPaused;
        if (isPaused) {
          pauseBadge.classList.remove('hidden');
          pauseBadge.classList.add('flex');
        } else {
          pauseBadge.classList.add('hidden');
          pauseBadge.classList.remove('flex');
        }
      });

      /**
       * Выделяет фундаментальную частоту голоса f0 с защитой от шипящих согласных и фонового шума.
       * Возвращает { freq, clarity } либо null, если звук не является вокальным тоном.
       */
      function detectVocalPitch(rawBuf, bandBuf, sampleRate) {
        const n = bandBuf.length;

        // Шаг 1: Считаем RMS в вокальной полосе, полный RMS и частоту пересечения нуля (ZCR) на сыром сигнале
        let rawEnergy = 0.0;
        let bandEnergy = 0.0;
        let zeroCrossings = 0;

        for (let i = 0; i < n; i++) {
          const r = rawBuf[i];
          const b = bandBuf[i];
          rawEnergy += r * r;
          bandEnergy += b * b;
          if (i > 0 && ((rawBuf[i - 1] >= 0 && r < 0) || (rawBuf[i - 1] < 0 && r >= 0))) {
            zeroCrossings++;
          }
        }

        const bandRms = Math.sqrt(bandEnergy / n);
        const rawRms = Math.sqrt(rawEnergy / n);
        const zcr = zeroCrossings / n;

        // Порог громкости с гистерезисом
        const minRms = isVoicedState ? RMS_HOLD_THRESHOLD : RMS_ONSET_THRESHOLD;
        if (bandRms < minRms) {
          return null;
        }

        // Отсечение шипящих согласных (с, ш, щ, ц, ч, ф) и резких вдохов:
        // У шипящих высокая доля пересечений нуля (ZCR) и энергия сосредоточена выше 1500 Гц
        if (zcr > MAX_ZCR_VOICED) {
          return null;
        }
        const highFreqEnergy = Math.max(0.0, rawEnergy - bandEnergy);
        if (bandEnergy > 0 && (highFreqEnergy / bandEnergy) > HF_LF_RATIO_MAX && zcr > 0.11) {
          return null;
        }

        // Шаг 2: McLeod Pitch Method (Normalized Square Difference Function - NSDF)
        // Ограничиваем диапазон задержек (tau) вокальным диапазоном [75 Гц .. 1450 Гц]
        const minTau = Math.max(2, Math.floor(sampleRate / MAX_VOCAL_FREQ));
        const maxTau = Math.min(Math.floor(n / 2), Math.ceil(sampleRate / MIN_VOCAL_FREQ));

        // Используем окно анализа W для высокой скорости и точности на мобильных процессорах
        const W = Math.min(1024, n - maxTau);

        // Предварительный расчёт кумулятивных квадратов для быстрой нормализации NSDF
        let m0 = 0.0;
        for (let i = 0; i < W; i++) {
          m0 += bandBuf[i] * bandBuf[i];
        }

        let mTau = 0.0;
        for (let i = minTau; i < minTau + W; i++) {
          mTau += bandBuf[i] * bandBuf[i];
        }

        for (let tau = minTau; tau <= maxTau; tau++) {
          if (tau > minTau) {
            const prevIdx = tau - 1;
            const nextIdx = tau - 1 + W;
            mTau += bandBuf[nextIdx] * bandBuf[nextIdx] - bandBuf[prevIdx] * bandBuf[prevIdx];
          }

          let acf = 0.0;
          // Развернутый внутренний цикл автокорреляции
          let i = 0;
          const limit = W - 3;
          for (; i < limit; i += 4) {
            acf += bandBuf[i] * bandBuf[i + tau] +
                   bandBuf[i + 1] * bandBuf[i + 1 + tau] +
                   bandBuf[i + 2] * bandBuf[i + 2 + tau] +
                   bandBuf[i + 3] * bandBuf[i + 3 + tau];
          }
          for (; i < W; i++) {
            acf += bandBuf[i] * bandBuf[i + tau];
          }

          const denom = m0 + mTau;
          nsdfBuffer[tau] = denom > 1e-9 ? (2.0 * acf) / denom : 0.0;
        }

        // Шаг 3: Поиск первого ключевого максимума после пересечения нуля в положительную область
        // Это гарантирует выбор фундаментальной частоты f0, а не второй гармоники (октавы)
        let tau = minTau;
        // Сначала дожидаемся спада от начального пика tau=0 ниже 0 (если ещё не ниже)
        while (tau <= maxTau && nsdfBuffer[tau] > 0.0) {
          tau++;
        }
        // Теперь ищем положительные купола NSDF
        const peakTaus = [];
        const peakVals = [];
        let globalMaxVal = -1.0;

        while (tau <= maxTau) {
          // Пропускаем отрицательную зону
          while (tau <= maxTau && nsdfBuffer[tau] <= 0.0) {
            tau++;
          }
          if (tau > maxTau) break;

          let localMaxTau = tau;
          let localMaxVal = nsdfBuffer[tau];

          while (tau <= maxTau && nsdfBuffer[tau] > 0.0) {
            if (nsdfBuffer[tau] > localMaxVal) {
              localMaxVal = nsdfBuffer[tau];
              localMaxTau = tau;
            }
            tau++;
          }

          peakTaus.push(localMaxTau);
          peakVals.push(localMaxVal);
          if (localMaxVal > globalMaxVal) {
            globalMaxVal = localMaxVal;
          }
        }

        if (peakTaus.length === 0 || globalMaxVal < NSDF_CLARITY_THRESHOLD) {
          return null;
        }

        // Выбираем первый пик, преодолевший порог 0.88 от абсолютного максимума (критерий McLeod k=0.88)
        const selectionThreshold = Math.max(NSDF_CLARITY_THRESHOLD, 0.88 * globalMaxVal);
        let chosenTau = peakTaus[0];
        let chosenClarity = peakVals[0];

        for (let p = 0; p < peakTaus.length; p++) {
          if (peakVals[p] >= selectionThreshold) {
            chosenTau = peakTaus[p];
            chosenClarity = peakVals[p];
            break;
          }
        }

        // Шаг 4: Параболическая интерполяция для суб-сэмпловой точности (точность до долей цента)
        let refinedTau = chosenTau;
        if (chosenTau > minTau && chosenTau < maxTau) {
          const y1 = nsdfBuffer[chosenTau - 1];
          const y2 = nsdfBuffer[chosenTau];
          const y3 = nsdfBuffer[chosenTau + 1];
          const denom = 2.0 * (2.0 * y2 - y1 - y3);
          if (Math.abs(denom) > 1e-9) {
            const delta = (y3 - y1) / denom;
            if (Math.abs(delta) < 1.0) {
              refinedTau = chosenTau + delta;
            }
          }
        }

        const freq = sampleRate / refinedTau;
        if (freq < MIN_VOCAL_FREQ || freq > MAX_VOCAL_FREQ) {
          return null;
        }

        return { freq, clarity: chosenClarity };
      }

      /**
       * Пересчитывает для последних точек в буфере:
       * 1) Центральную линию тона (Core Pitch) без фазового сдвига (симметричное окно ~0.22с),
       *    чтобы линия проходила ровно посередине волны вибрато.
       * 2) Верхнюю и нижнюю огибающие широты вибрато (Envelope).
       * 3) Численные показатели периодичности (Гц) и широты (±пт).
       */
      function updateVibratoAnalytics() {
        if (historyCount === 0) return;

        // Окно сглаживания центра тона: ~10 кадров в прошлое и ~10 в будущее (~0.33 сек полный период, ~1.8 цикла вибрато)
        const halfWindow = 10;
        const envHalfWindow = 12;
        const updateSpan = Math.min(historyCount, 32);

        for (let offset = 0; offset < updateSpan; offset++) {
          const idx = (historyHead - 1 - offset + BUFFER_CAPACITY) % BUFFER_CAPACITY;
          if (!historyVoiced[idx]) continue;

          // Вычисляем симметричный взвешенный центр тона (Core Pitch)
          let sumWeightedMidi = 0.0;
          let sumWeights = 0.0;
          const baseMidi = historyMidi[idx];

          for (let k = -halfWindow; k <= halfWindow; k++) {
            const posFromLatest = offset - k;
            if (posFromLatest < 0 || posFromLatest >= historyCount) continue;

            const nIdx = (historyHead - 1 - posFromLatest + BUFFER_CAPACITY) % BUFFER_CAPACITY;
            if (!historyVoiced[nIdx]) continue;

            const m = historyMidi[nIdx];
            // Не смешиваем разные ноты при быстром стаккато или скачке на большой интервал (> 2.2 пт)
            if (Math.abs(m - baseMidi) > 2.2) continue;

            // Косинусное окно Ханна
            const w = 0.5 * (1.0 + Math.cos((Math.PI * k) / (halfWindow + 1)));
            sumWeightedMidi += m * w;
            sumWeights += w;
          }

          const centerMidi = sumWeights > 0 ? sumWeightedMidi / sumWeights : baseMidi;
          historyCenter[idx] = centerMidi;

          // Вычисляем локальную широту колебаний вокруг центра для отрисовки коридора (огибающей) вибрато
          let sumSqDev = 0.0;
          let devCount = 0;
          for (let k = -envHalfWindow; k <= envHalfWindow; k++) {
            const posFromLatest = offset - k;
            if (posFromLatest < 0 || posFromLatest >= historyCount) continue;
            const nIdx = (historyHead - 1 - posFromLatest + BUFFER_CAPACITY) % BUFFER_CAPACITY;
            if (!historyVoiced[nIdx]) continue;
            const m = historyMidi[nIdx];
            if (Math.abs(m - centerMidi) > 2.2) continue;

            const diff = m - historyCenter[nIdx];
            sumSqDev += diff * diff;
            devCount++;
          }

          // Для синусоиды амплитуда пика A = sqrt(2) * RMS
          const rmsDev = devCount > 2 ? Math.sqrt(sumSqDev / devCount) : 0.0;
          const amp = Math.min(1.8, rmsDev * 1.4142);
          historyEnvUpper[idx] = centerMidi + amp;
          historyEnvLower[idx] = centerMidi - amp;
        }

        // Вычисляем частоту (Гц) и широту (±пт) вибрато за последние ~0.95 секунды непрерывного звука
        const analysisSamples = Math.min(historyCount, 58);
        let voicedRun = 0;
        let sumSqMod = 0.0;

        // Собираем массив отклонений от центра тона в хронологическом порядке
        const modWave = [];
        const modTimes = [];

        const latestIdx = (historyHead - 1 + BUFFER_CAPACITY) % BUFFER_CAPACITY;
        const latestCenter = historyCenter[latestIdx];

        for (let i = 0; i < analysisSamples; i++) {
          const idx = (historyHead - 1 - i + BUFFER_CAPACITY) % BUFFER_CAPACITY;
          if (!historyVoiced[idx]) break;
          // Проверяем, что певец держит одну и ту же ноту (центр не ушёл дальше чем на 1.2 полутона)
          if (Math.abs(historyCenter[idx] - latestCenter) > 1.2) break;

          const delta = historyMidi[idx] - historyCenter[idx];
          modWave.unshift(delta);
          modTimes.unshift(historyTime[idx]);
          sumSqMod += delta * delta;
          voicedRun++;
        }

        if (voicedRun < 20) {
          // Слишком короткая нота для оценки установившегося вибрато
          if (!isVoicedState) {
            rateDisplay.textContent = '— Гц';
            extentDisplay.textContent = '±— пт';
          }
          return;
        }

        // Широта (амплитуда отклонения от центра в полутонах)
        const rmsMod = Math.sqrt(sumSqMod / voicedRun);
        const halfExtentSemitones = rmsMod * 1.4142;

        // Детекция пересечений нуля с гистерезисом для подсчёта частоты вибрато (Гц)
        const hysteresis = 0.045; // ~4.5 цента порог против микро-дрожания на прямом звуке
        const crossings = [];
        let state = 0; // 1 = выше порога, -1 = ниже порога

        for (let i = 1; i < modWave.length; i++) {
          const val = modWave[i];
          const prev = modWave[i - 1];

          if (state <= 0 && val > hysteresis) {
            // Линейная интерполяция момента пересечения 0 снизу вверх
            const frac = (0.0 - prev) / (val - prev + 1e-9);
            const tCross = modTimes[i - 1] + Math.max(0, Math.min(1, frac)) * (modTimes[i] - modTimes[i - 1]);
            if (state === -1) {
              crossings.push(tCross);
            }
            state = 1;
          } else if (state >= 0 && val < -hysteresis) {
            state = -1;
          }
        }

        // Классическое вокальное вибрато лежит в пределах 3.5 – 8.8 Гц
        if (crossings.length >= 2 && halfExtentSemitones >= 0.08) {
          const totalTime = crossings[crossings.length - 1] - crossings[0];
          const numCycles = crossings.length - 1;
          const rateHz = numCycles / totalTime;

          if (rateHz >= 3.3 && rateHz <= 9.2) {
            rateDisplay.textContent = rateHz.toFixed(1) + ' Гц';
            extentDisplay.textContent = '±' + halfExtentSemitones.toFixed(2) + ' пт';
          } else {
            rateDisplay.textContent = '— Гц';
            extentDisplay.textContent = '±' + halfExtentSemitones.toFixed(2) + ' пт';
          }
        } else {
          // Прямой тон (senza vibrato)
          rateDisplay.textContent = 'прямой';
          extentDisplay.textContent = '±' + halfExtentSemitones.toFixed(2) + ' пт';
        }
      }

      function processAudioFrame(nowSec) {
        rawAnalyser.getFloatTimeDomainData(rawTimeBuffer);
        vocalBandAnalyser.getFloatTimeDomainData(bandTimeBuffer);

        const detection = detectVocalPitch(rawTimeBuffer, bandTimeBuffer, audioCtx.sampleRate);

        let frameVoiced = false;
        let frameMidi = 0.0;

        if (detection !== null) {
          const rawMidi = freqToMidi(detection.freq);

          // Медианный фильтр из 3 кадров подавляет одиночные выбросы на переходных процессах (согласная -> гласная)
          recentMidiWindow.push(rawMidi);
          if (recentMidiWindow.length > 3) recentMidiWindow.shift();

          const filteredMidi = recentMidiWindow.length === 3
            ? medianOf3(recentMidiWindow[0], recentMidiWindow[1], recentMidiWindow[2])
            : rawMidi;

          // Защита от нефизиологичного мгновенного скачка за 1 кадр (16 мс)
          if (lastAcceptedMidi !== null && isVoicedState) {
            const jump = Math.abs(filteredMidi - lastAcceptedMidi);
            if (jump > MAX_SEMITONE_JUMP_PER_FRAME) {
              // Требуем подтверждения в следующем кадре, если это реальный вокальный скачок на большой интервал
              lastAcceptedMidi = filteredMidi;
              return;
            }
          }

          lastAcceptedMidi = filteredMidi;
          if (smoothedInstantMidi === null || !isVoicedState) {
            smoothedInstantMidi = filteredMidi;
          } else {
            // Лёгкое сглаживание (коэффициент 0.65) сохраняет всю форму вибрато 5-7 Гц, убирая лишь цифровой джиттер
            smoothedInstantMidi += 0.65 * (filteredMidi - smoothedInstantMidi);
          }

          frameVoiced = true;
          frameMidi = smoothedInstantMidi;
          isVoicedState = true;
          unvoicedFramesCount = 0;
        } else {
          unvoicedFramesCount++;
          // Краткий допуск в 2 кадра (~32 мс) при просадке фазы, затем чистый разрыв линии
          if (unvoicedFramesCount > 2) {
            isVoicedState = false;
            recentMidiWindow.length = 0;
            smoothedInstantMidi = null;
          } else if (isVoicedState && smoothedInstantMidi !== null) {
            frameVoiced = true;
            frameMidi = smoothedInstantMidi;
          }
        }

        // Записываем точку в кольцевой буфер
        historyTime[historyHead] = nowSec;
        historyMidi[historyHead] = frameMidi;
        historyCenter[historyHead] = frameMidi;
        historyEnvUpper[historyHead] = frameMidi;
        historyEnvLower[historyHead] = frameMidi;
        historyVoiced[historyHead] = frameVoiced ? 1 : 0;

        historyHead = (historyHead + 1) % BUFFER_CAPACITY;
        if (historyCount < BUFFER_CAPACITY) historyCount++;

        updateVibratoAnalytics();

        // Обновляем плавное положение камеры и верхний индикатор ноты
        if (frameVoiced) {
          const latestIdx = (historyHead - 1 + BUFFER_CAPACITY) % BUFFER_CAPACITY;
          const coreMidi = historyCenter[latestIdx];
          targetCameraMidi = coreMidi;

          // Определяем звучащую ноту по ЦЕНТРУ вибрато (а не по мгновенным пикам колебаний)
          const nearestNoteMidi = Math.round(coreMidi);
          const centsOffset = Math.round((coreMidi - nearestNoteMidi) * 100);
          const centerFreq = midiToFreq(coreMidi);

          noteDisplay.textContent = midiToNoteLabel(nearestNoteMidi);
          freqDisplay.textContent = centerFreq.toFixed(1) + ' Гц';
          const sign = centsOffset > 0 ? '+' : '';
          centsDisplay.textContent = `центр ${sign}${centsOffset} ц`;

          // Цветовая индикация точности интонирования центра ноты
          if (Math.abs(centsOffset) <= 18) {
            centsDisplay.className = 'mono-num text-[11px] sm:text-xs text-emerald-400 leading-tight';
          } else if (Math.abs(centsOffset) <= 35) {
            centsDisplay.className = 'mono-num text-[11px] sm:text-xs text-amber-400 leading-tight';
          } else {
            centsDisplay.className = 'mono-num text-[11px] sm:text-xs text-rose-400 leading-tight';
          }
        }

        // Инерционное следование вертикальной оси графика за центром голоса
        // Низкий коэффициент (0.045) гарантирует, что сетка нот стоит неподвижно во время вибрато
        const diffCam = targetCameraMidi - cameraCenterMidi;
        if (Math.abs(diffCam) > 2.2) {
          // При переходе в другой регистр камера быстрее догоняет голос
          cameraCenterMidi += diffCam * 0.14;
        } else {
          cameraCenterMidi += diffCam * 0.035;
        }
      }

      function renderGraph(nowSec) {
        const w = viewWidth;
        const h = viewHeight;

        // 1. Очистка фона глубоким студийным цветом
        ctx.fillStyle = '#06070a';
        ctx.fillRect(0, 0, w, h);

        // Геометрия графика: справа оставляем узкую колонку для читаемых подписей нот и шкалы полутонов
        const rightAxisWidth = w < 500 ? 52 : 64;
        const plotRight = w - rightAxisWidth;
        const topPad = 68;
        const bottomPad = 24;
        const plotHeight = Math.max(100, h - topPad - bottomPad);
        const plotCenterY = topPad + plotHeight * 0.5;
        const pixelsPerSemitone = plotHeight / VISIBLE_SEMITONE_SPAN;

        const midiToY = (midi) => plotCenterY - (midi - cameraCenterMidi) * pixelsPerSemitone;
        const timeToX = (t) => plotRight - ((nowSec - t) / HISTORY_SECONDS) * plotRight;

        // Определяем активную целевую ноту (по центру вибрато)
        let activeNoteInt = null;
        if (historyCount > 0) {
          const latestIdx = (historyHead - 1 + BUFFER_CAPACITY) % BUFFER_CAPACITY;
          if (historyVoiced[latestIdx]) {
            activeNoteInt = Math.round(historyCenter[latestIdx]);
          }
        }

        // 2. Вертикальная сетка времени (Периодичность вибрато):
        //    - Основные линии каждую 1.0 секунду
        //    - Тонкие деления каждые 0.2 секунды (200 мс = 1 период эталонного вибрато 5 Гц)
        const firstSubTick = Math.floor((nowSec - HISTORY_SECONDS) * 5) / 5;
        ctx.lineWidth = 1;

        for (let t = firstSubTick; t <= nowSec; t += 0.2) {
          const x = timeToX(t);
          if (x < 0 || x > plotRight) continue;

          const isWholeSecond = Math.abs(t - Math.round(t)) < 0.02;
          ctx.strokeStyle = isWholeSecond ? 'rgba(148, 163, 184, 0.11)' : 'rgba(148, 163, 184, 0.035)';
          ctx.beginPath();
          ctx.moveTo(x, topPad * 0.6);
          ctx.lineTo(x, h);
          ctx.stroke();

          if (isWholeSecond) {
            const secAgo = Math.round(nowSec - t);
            if (secAgo > 0 && secAgo <= HISTORY_SECONDS) {
              ctx.fillStyle = 'rgba(100, 116, 139, 0.45)';
              ctx.font = '500 10px "JetBrains Mono", monospace';
              ctx.textAlign = 'left';
              ctx.fillText(`-${secAgo}с`, x + 4, h - 8);
            }
          }
        }

        // 3. Горизонтальная сетка нот и полутоновых интервалов (Широта вибрато):
        const minVisibleMidi = Math.floor(cameraCenterMidi - VISIBLE_SEMITONE_SPAN * 0.65);
        const maxVisibleMidi = Math.ceil(cameraCenterMidi + VISIBLE_SEMITONE_SPAN * 0.65);

        for (let m = minVisibleMidi; m <= maxVisibleMidi; m++) {
          const y = midiToY(m);
          if (y < 20 || y > h - 10) continue;

          const isCurrentTarget = (activeNoteInt === m);
          const blackKey = isBlackKey(m);

          // Мягкая подсветка полосы активной ноты (±0.5 полутона вокруг ноты)
          if (isCurrentTarget) {
            const bandHalf = pixelsPerSemitone * 0.5;
            const grad = ctx.createLinearGradient(0, y - bandHalf, 0, y + bandHalf);
            grad.addColorStop(0, 'rgba(34, 211, 238, 0.01)');
            grad.addColorStop(0.5, 'rgba(34, 211, 238, 0.075)');
            grad.addColorStop(1, 'rgba(34, 211, 238, 0.01)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, y - bandHalf, plotRight, bandHalf * 2);

            // Пунктирные микро-линии ±0.5 полутона (±50 центов) для наглядного чтения широты вибрато
            ctx.save();
            ctx.setLineDash([3, 5]);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.22)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, y - bandHalf);
            ctx.lineTo(plotRight, y - bandHalf);
            ctx.moveTo(0, y + bandHalf);
            ctx.lineTo(plotRight, y + bandHalf);
            ctx.stroke();
            ctx.restore();
          }

          // Основная горизонтальная линия тона
          ctx.strokeStyle = isCurrentTarget
            ? 'rgba(34, 211, 238, 0.45)'
            : (blackKey ? 'rgba(148, 163, 184, 0.07)' : 'rgba(148, 163, 184, 0.14)');
          ctx.lineWidth = isCurrentTarget ? 1.5 : 1.0;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(plotRight, y);
          ctx.stroke();
        }

        // 4. Отрисовка вокальной траектории, коридора широты и центральной линии стабильности
        if (historyCount > 1) {
          // Разбиваем историю на непрерывные вокальные сегменты (фразы)
          const segments = [];
          let currentSeg = [];

          for (let i = historyCount - 1; i >= 0; i--) {
            const idx = (historyHead - 1 - i + BUFFER_CAPACITY) % BUFFER_CAPACITY;
            const t = historyTime[idx];
            if (nowSec - t > HISTORY_SECONDS + 0.15) continue;

            if (historyVoiced[idx]) {
              const x = timeToX(t);
              // Если между соседними точками скачок > 3 полутонов, начинаем новый визуальный сегмент
              if (currentSeg.length > 0) {
                const prevPt = currentSeg[currentSeg.length - 1];
                if (Math.abs(historyMidi[idx] - prevPt.midi) > 3.0) {
                  if (currentSeg.length > 1) segments.push(currentSeg);
                  currentSeg = [];
                }
              }
              currentSeg.push({
                x,
                yPitch: midiToY(historyMidi[idx]),
                yCenter: midiToY(historyCenter[idx]),
                yUpper: midiToY(historyEnvUpper[idx]),
                yLower: midiToY(historyEnvLower[idx]),
                midi: historyMidi[idx],
                centerMidi: historyCenter[idx]
              });
            } else {
              if (currentSeg.length > 1) segments.push(currentSeg);
              currentSeg = [];
            }
          }
          if (currentSeg.length > 1) segments.push(currentSeg);

          // Слой 4А: Полупрозрачный коридор огибающей широты вибрато (Envelope Ribbon)
          for (let s = 0; s < segments.length; s++) {
            const seg = segments[s];
            if (seg.length < 4) continue;

            ctx.fillStyle = 'rgba(99, 102, 241, 0.13)';
            ctx.beginPath();
            ctx.moveTo(seg[0].x, seg[0].yUpper);
            for (let i = 1; i < seg.length; i++) {
              ctx.lineTo(seg[i].x, seg[i].yUpper);
            }
            for (let i = seg.length - 1; i >= 0; i--) {
              ctx.lineTo(seg[i].x, seg[i].yLower);
            }
            ctx.closePath();
            ctx.fill();
          }

          // Слой 4Б: Осевая линия центра тона (Стабильность вибрато / Core Pitch Line)
          // Показывает певцу, держит ли он ровную опору тона внутри вибрато
          ctx.save();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = 'rgba(248, 250, 252, 0.42)';
          ctx.setLineDash([4, 4]);
          for (let s = 0; s < segments.length; s++) {
            const seg = segments[s];
            if (seg.length < 3) continue;
            ctx.beginPath();
            ctx.moveTo(seg[0].x, seg[0].yCenter);
            for (let i = 1; i < seg.length; i++) {
              ctx.lineTo(seg[i].x, seg[i].yCenter);
            }
            ctx.stroke();
          }
          ctx.restore();

          // Слой 4В: Главная живая волна высоты голоса со сглаживанием кривыми Безье
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          for (let s = 0; s < segments.length; s++) {
            const seg = segments[s];

            // Мягкое свечение основной волны
            ctx.strokeStyle = 'rgba(34, 211, 238, 0.24)';
            ctx.lineWidth = 6.0;
            ctx.beginPath();
            ctx.moveTo(seg[0].x, seg[0].yPitch);
            for (let i = 1; i < seg.length - 1; i++) {
              const xc = (seg[i].x + seg[i + 1].x) * 0.5;
              const yc = (seg[i].yPitch + seg[i + 1].yPitch) * 0.5;
              ctx.quadraticCurveTo(seg[i].x, seg[i].yPitch, xc, yc);
            }
            ctx.lineTo(seg[seg.length - 1].x, seg[seg.length - 1].yPitch);
            ctx.stroke();

            // Чёткое ядро волны
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(seg[0].x, seg[0].yPitch);
            for (let i = 1; i < seg.length - 1; i++) {
              const xc = (seg[i].x + seg[i + 1].x) * 0.5;
              const yc = (seg[i].yPitch + seg[i + 1].yPitch) * 0.5;
              ctx.quadraticCurveTo(seg[i].x, seg[i].yPitch, xc, yc);
            }
            ctx.lineTo(seg[seg.length - 1].x, seg[seg.length - 1].yPitch);
            ctx.stroke();
          }
          ctx.restore();

          // Слой 4Г: Световая точка текущего мгновенного положения голоса на правом краю графика
          const latestIdx = (historyHead - 1 + BUFFER_CAPACITY) % BUFFER_CAPACITY;
          if (historyVoiced[latestIdx]) {
            const curY = midiToY(historyMidi[latestIdx]);
            const centerY = midiToY(historyCenter[latestIdx]);

            // Маркер центра вибрато на оси
            ctx.fillStyle = 'rgba(248, 250, 252, 0.85)';
            ctx.beginPath();
            ctx.arc(plotRight, centerY, 3.0, 0, Math.PI * 2);
            ctx.fill();

            // Светящийся курсор мгновенной высоты тона
            ctx.fillStyle = 'rgba(34, 211, 238, 0.3)';
            ctx.beginPath();
            ctx.arc(plotRight, curY, 9.0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#67e8f9';
            ctx.beginPath();
            ctx.arc(plotRight, curY, 4.0, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // 5. Правая колонка шкалы нот (всегда чёткая поверх линий графика)
        ctx.fillStyle = 'rgba(6, 7, 10, 0.88)';
        ctx.fillRect(plotRight, 0, rightAxisWidth, h);

        ctx.strokeStyle = 'rgba(148, 163, 184, 0.16)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(plotRight, 0);
        ctx.lineTo(plotRight, h);
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';

        for (let m = minVisibleMidi; m <= maxVisibleMidi; m++) {
          const y = midiToY(m);
          if (y < 24 || y > h - 14) continue;

          const isCurrentTarget = (activeNoteInt === m);
          const blackKey = isBlackKey(m);
          const label = midiToNoteLabel(m);

          if (isCurrentTarget) {
            // Плашка звучащей ноты на вертикальной шкале
            ctx.fillStyle = 'rgba(34, 211, 238, 0.16)';
            ctx.beginPath();
            ctx.roundRect(plotRight + 5, y - 11, rightAxisWidth - 10, 22, 6);
            ctx.fill();

            ctx.fillStyle = '#22d3ee';
            ctx.font = '600 13px "JetBrains Mono", monospace';
            ctx.fillText(label, plotRight + 11, y);
          } else {
            ctx.fillStyle = blackKey ? 'rgba(148, 163, 184, 0.38)' : 'rgba(203, 213, 225, 0.72)';
            ctx.font = blackKey ? '400 11px "JetBrains Mono", monospace' : '500 12px "JetBrains Mono", monospace';
            ctx.fillText(label, plotRight + 11, y);
          }
        }
      }

      let lastRenderTimestamp = 0;

      function mainLoop(timestamp) {
        if (!isRunning) return;
        requestAnimationFrame(mainLoop);

        if (isPaused) return;

        const nowSec = timestamp * 0.001;
        // Фиксированный шаг дискретизации огибающей (~60 Гц)
        if (timestamp - lastRenderTimestamp >= 14) {
          lastRenderTimestamp = timestamp;
          processAudioFrame(nowSec);
        }

        renderGraph(nowSec);
      }
    })();
  </script>
</body>
</html>
